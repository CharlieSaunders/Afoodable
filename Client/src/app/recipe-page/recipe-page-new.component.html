<br><br><br>
<div class="container" *ngIf="recipe">
	<div class="row align-items-center">
		<div class="col-lg-7">
			<img class="img-fluid rounded mb-4 mb-lg-0" src="../../assets/images/recipes/{{ recipe.imageUrl }}" alt="{{recipe.name}}" />
		</div>
		<div class="col-lg-5">
			<h1 class="font-weight-light">{{recipe.name}}</h1>
			<p>{{recipe.description}}</p>
			<span matTooltip="Calories">🔥 {{recipe.calories}} kcal </span>
			<span matTooltip="Protein">🥩 {{recipe.protein}}g </span>
			<span matTooltip="Fat">🧀 {{recipe.fat}}g </span>
			<span matTooltip="Carbohydrates">🥔 {{recipe.carbohydrates}}g </span>
		</div>
	</div>

	<div class="row">
		<div class="col-4">
			<mat-card class="glassy my-4">
				<mat-card-header>
				  <mat-card-title>🥕 Ingredients</mat-card-title>
				</mat-card-header>
				<mat-card-content>
					<div class="text-dark">
						<table style="width: 100%">
							<tr>
								<th>Name</th>
								<th>Amount</th>
								<th>Cost</th>
							</tr>
							<tr *ngFor="let ingredient of recipe.ingredients; let i=index;">
								<td>{{ingredient.name}}</td>
								<td>{{ingredient.getTotalRequired()}}</td>
								<td>~£{{ingredient.getCost()}}</td>
							</tr>
						</table>
					</div>
				</mat-card-content>
			  </mat-card>
		</div>

		<div class="col-1"></div>

		<div class="col-7">
			<mat-accordion class="my-5 p-1">
				<mat-expansion-panel class="glassy">
					<mat-expansion-panel-header>
						<mat-card-title class="text-dark">
							🍽️ View Recipe Steps
						</mat-card-title>
					</mat-expansion-panel-header>
					<mat-accordion class="my-5 m-1" *ngFor="let step of recipe.steps; let i=index;">
						<mat-expansion-panel>
							  <mat-expansion-panel-header class="glassy-bg-dark">
								<mat-panel-title class="text-light text-uppercase">
									  Step: {{i+1}}
								</mat-panel-title>
							  </mat-expansion-panel-header>
							<p>{{step}}</p>
						</mat-expansion-panel>
					</mat-accordion>
				</mat-expansion-panel>
			</mat-accordion>
		</div>
	</div>
</div>
