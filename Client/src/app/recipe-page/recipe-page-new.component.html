<br><br><br>
<div class="container" *ngIf="recipe">
	<div class="row align-items-center">
		<div class="col-lg-7">
			<img class="img-fluid rounded mb-4 mb-lg-0" src="../../assets/images/recipes/{{ recipe.imageUrl }}" alt="{{recipe.name}}" />
		</div>
		<div class="col-lg-5">
			<h1 class="font-weight-light">{{recipe.name}}</h1>
			<p>{{recipe.description}}</p>
			<app-macros [macros]="recipe.macros" [displayMeasurement]="true"></app-macros>
		</div>
	</div>

	<div class="row">
		<div class="col-4">
			<mat-card class="glassy my-4">
				<mat-card-header>
				  <mat-card-title>
					<button matTooltip="Add an ingredient" mat-mini-fab class="m-2 p-1 bg-dark text-light" (click)="toggleAddNewIngredientModal()">+</button>
					<span>🥕 Ingredients</span>
				  </mat-card-title>
				</mat-card-header>
				<mat-card-content>
					<div class="text-dark" *ngIf="recipe.ingredients.length > 0">
						<table style="width: 100%">
							<tr>
								<th>Name</th>
								<th>Amount</th>
								<th>Cost</th>
								<th></th>
							</tr>
							<tr *ngFor="let ingredient of recipe.ingredients; let i=index;">
								<td>{{ingredient.name}}</td>
								<td>{{ingredient.getTotalRequired()}}</td>
								<td>~£{{ingredient.getCost()}}</td>
								<td>
									<button type="button" class="btn btn-success mx-4" (click)="amendIngredientAtIndex(i, 1)">+</button>
									<button type="button" class="btn btn-danger" (click)="amendIngredientAtIndex(i, -1)">-</button>
								</td>
							</tr>
						</table>
					</div>
					<p *ngIf="recipe.ingredients.length == 0">There are no ingredients to display</p>
				</mat-card-content>
			  </mat-card>
		</div>

		<div class="col-1"></div>

		<div class="col-7">
			<mat-accordion class="my-5 p-1">
				<mat-expansion-panel class="glassy">
					<mat-expansion-panel-header>
						<mat-card-title class="text-dark">
							🍽️ Recipe Steps
						</mat-card-title>
					</mat-expansion-panel-header>
					<mat-accordion class="my-5 m-1" *ngIf="recipe.steps.length > 0">
						<mat-card class="glassy my-4 text-dark" *ngFor="let step of recipe.steps; let i=index;">
							<mat-card-header>
								<mat-card-title>Step: {{i+1}}</mat-card-title>
							</mat-card-header>
							<mat-card-content>
								<p>{{step}}</p>
							</mat-card-content>
						</mat-card>
					</mat-accordion>
					<p *ngIf="recipe.steps.length == 0">There are no steps for this recipe</p>
				</mat-expansion-panel>
			</mat-accordion>
		</div>
	</div>
</div>

<app-recipe-add-ingredient-modal
	[display]="displayAddNewIngredientModal"
	(closeWithValueEvent)="addIngredientToRecipe($event)"
	(closeWithoutValueEvent)="toggleAddNewIngredientModal()">
</app-recipe-add-ingredient-modal>
