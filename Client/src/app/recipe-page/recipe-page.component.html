<br><br><br>
<div class="container" *ngIf="recipe">
	<div class="bg-dark text-secondary px-4 py-5 text-center" style="background-image: linear-gradient(rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.6)), url('../../assets/images/recipes/{{ recipe.imageUrl }}')">
    	<div class="py-5">
      		<h1 class="display-5 fw-bold text-white">{{recipe.name}}</h1>
      		<div class="col-lg-8 mx-auto">
        		<p class="fs-5 mb-4 text-white">{{recipe.description}}</p>
				<app-macros [macros]="recipe.macros" [displayMeasurement]="true"></app-macros>
				<br>
       			<div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
        			<div class="m-2">
						<button matTooltip="Save Recipe" mat-fab class="m-1 bg-success text-dark" (click)="saveRecipe()">
		  					<span class="icon-emoji">💾</span>
						</button>
						<button *ngIf="recipe.favourite" matTooltip="Un-Favourite" mat-fab class="m-1 bg-warning text-dark" (click)="toggleFavourite()">
		  					<span class="icon-emoji">🌟</span>
						</button>
						<button *ngIf="!recipe.favourite" matTooltip="Favourite" mat-fab class="m-1 text-dark" (click)="toggleFavourite()">
		  					<span class="icon-emoji greyed-out">⭐</span>
						</button>
						<button matTooltip="Update Image" mat-fab class="m-1 bg-info text-dark">
							<label for="file-upload" >📷</label>
							<input type="file" id="file-upload" (change)="onFileChanged($event)">
						</button>
  					</div>
       			</div>
      		</div>
    	</div>
  	</div>

	<div class="row">
		<div class="col-lg-5 col-sm-12">
			<mat-card class="glassy my-4">
				<mat-card-header>
				  <mat-card-title>
					<h4><button matTooltip="Add an ingredient" mat-mini-fab class="m-2 p-1 bg-dark text-light" (click)="toggleAddNewIngredientModal()">+</button>
					🥕 Ingredients</h4>
				  </mat-card-title>
				</mat-card-header>
				<mat-card-content>
					<div class="text-dark" *ngIf="recipe.ingredients.length > 0">
						<table class="table table-hover table-responsive" style="width: 100%">
							<tr>
								<th scope="col">Name</th>
								<th scope="col">Amount</th>
								<th scope="col">Cost</th>
								<th scope="col"></th>
							</tr>
							<tr *ngFor="let ingredient of recipe.ingredients; let i=index;">
								<td scope="row">{{ingredient.name}}</td>
								<td>{{ingredient.getTotalRequired()}}</td>
								<td>~£{{ingredient.getCost()}}</td>
								<td class="text-right">
									<button type="button" style="float: left" class="btn btn-success mx-2 text-dark" (click)="amendIngredientAtIndex(i, 1)">+</button>
									<button type="button" style="float: right" class="btn btn-danger text-dark" (click)="amendIngredientAtIndex(i, -1)">-</button>
								</td>
							</tr>
						</table>
					</div>
					<p *ngIf="recipe.ingredients.length === 0">There are no ingredients to display</p>
				</mat-card-content>
			  </mat-card>
		</div>

		<div class="col-lg-7 col-sm-12">
			<mat-accordion class="my-5 p-1">
				<mat-expansion-panel class="glassy">
					<mat-expansion-panel-header>
						<mat-card-title class="text-dark">
							<h4 class="p-2">🍽️ Recipe Steps</h4>
						</mat-card-title>
					</mat-expansion-panel-header>
					<button matTooltip="Add a recipe step" mat-mini-fab class="m-2 p-1 bg-dark text-light" (click)="addEmptyRecipeStep()">+</button>
					<mat-accordion class="my-5 m-1" *ngIf="recipe.steps.length > 0">
						<mat-card class="glassy my-4 text-dark" *ngFor="let step of recipe.steps; let i=index;">
							<mat-card-header>
								<mat-card-title><button type="button" class="btn btn-danger p-1 m-1" (click)="removeStepAtIndex(i)">-</button> Step: {{i+1}}</mat-card-title>
							</mat-card-header>
							<mat-card-content>
								<textarea contenteditable="true" cols="30" style="width: 100%" [ngModel]="step" (ngModelChange)="updateStepText($event, i)" id="recipeStep{{i}}"></textarea>
							</mat-card-content>
						</mat-card>
					</mat-accordion>
					<p *ngIf="recipe.steps.length === 0">There are no steps for this recipe</p>
				</mat-expansion-panel>
			</mat-accordion>
		</div>
	</div>
</div>

<app-recipe-add-ingredient-modal
	[display]="displayAddNewIngredientModal"
	(closeWithValueEvent)="addIngredientToRecipe($event)"
	(closeWithoutValueEvent)="toggleAddNewIngredientModal()">
</app-recipe-add-ingredient-modal>
