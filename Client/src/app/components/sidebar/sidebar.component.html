<div class="sidebar-slider bg-dark text-light" style="z-index: 1001" [class.sidebar-slide-in]="display">
  <div class="sidebar-close p-2" (click)="toggleSidebar()">X</div><br>
    <div class="sidebar-content">
        <p class="p-0">Total: £{{shoppingList.getTotalCost()}}</p>
        <div class="row p-2">
            <h4 style="text-decoration: underline">Selected Recipes</h4>
            <ul style="list-style:none">
                <li *ngFor="let recipe of recipes">
                    <span *ngIf="recipe.selectedAmount > 0">
                        {{recipe.name}} x{{recipe.selectedAmount}}
                    </span>
                </li>
            </ul>
            <br>
            <h4 style="text-decoration: underline">Shopping List</h4>
            <ul style="list-style: none">
                <li *ngFor="let item of shoppingList.items | keyvalue">
                    <span *ngIf="(item.value.amount > 0)">{{item.value.getShoppingListString()}}</span>
                </li>
            </ul>
        </div>
        <button type="button" class="btn btn-success m-1" *ngIf="shoppingListHasAtLeastOneItem()" (click)="sendEmail()">📧 Email</button>
    </div>
</div>
