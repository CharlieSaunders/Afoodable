<div class="col-md-12 m-2 p-2">
    <div class="card recipeCard">
        <div *ngIf="timesSelected > 0" class="timesSelectedBox text-dark">x{{recipe.selectedAmount}}</div>
        <div class="background-block">
            <img src="../../assets/images/recipes/{{ recipe.imageUrl }}" (click)="navigateToRecipe(recipe._id)" class="background"/>
        </div>
        <div class="card-content">
            <h2>{{recipe.name}}</h2>
            <div class="icon-block">
                <span>🔥 {{recipe.calories.split(".")[0]}} | </span>
                <span>🍔 {{recipe.fat}} | </span>
                <span>🥩 {{recipe.protein}}</span>
            </div>
            <br><br>
            <small>~£{{recipe.totalCost}}</small>
            <div class="callToActionContainer">
                <button mat-mini-fab class="bg-light float-right" style="float:right" (click)="updateSelectRecipe(recipe)">➕</button>
                <button *ngIf="timesSelected > 0" mat-mini-fab class="bg-light float-right" style="float:left" (click)="updateUnselectRecipe(recipe)">➖</button>
        </div>
        </div>
    </div>
</div>
