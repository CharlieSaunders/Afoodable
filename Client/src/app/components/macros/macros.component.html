<div *ngIf="macros">
    <span class="text-white" matTooltip="Calories">🔥 {{macros.calories.split(".")[0]}} <span *ngIf="displayMeasurement">kCal</span> | </span>
    <span class="text-white" matTooltip="Fat">🍔 {{macros.fat.split(".")[0]}}<span *ngIf="displayMeasurement">g</span> | </span>
    <span class="text-white" matTooltip="Protein">🥩 {{macros.protein.split(".")[0]}}<span *ngIf="displayMeasurement">g</span> | </span>
    <span class="text-white" matTooltip="Carbohydrates">🥔 {{macros.carbohydrates.split(".")[0]}}<span *ngIf="displayMeasurement">g</span></span>
</div>
