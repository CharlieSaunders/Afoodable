<div *ngIf="macros">
    <span matTooltip="Calories">🔥 {{macros.calories.split(".")[0]}} <span *ngIf="displayMeasurement">kCal</span> | </span>
    <span matTooltip="Fat">🍔 {{macros.fat.split(".")[0]}}<span *ngIf="displayMeasurement">g</span> | </span>
    <span matTooltip="Protein">🥩 {{macros.protein.split(".")[0]}}<span *ngIf="displayMeasurement">g</span> | </span>
    <span matTooltip="Carbohydrates">🥔 {{macros.carbohydrates.split(".")[0]}}<span *ngIf="displayMeasurement">g</span></span>
</div>
