events{}
http {
    include /etc/nginx/mime.types;
    server {
        listen [::]:9998 ssl;
        ssl_certificate /etc/letsencrypt/live/the2charlies.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/the2charlies.net/privkey.pem;
        server_name the2charlies.net;
        root /usr/share/nginx/html;
        ssl_protocols TLSv1 TLSv1.1 TLSV1.2;
        index index.html index.php index.hml index.nginx-debian.html;
        location / {
            try_files $uri $uri/ index.html;
        }
    }

    server {
        listen 9999;
        listen [::]:9999;
        server_name the2charlies.net;
        root /usr/share/nginx/html;
        return 302 https://$server_name$request_uri;
    }
}